; PlatformIO project configuration for the Adafruit ESP32 Feather V2
; running micro-ROS over the Arduino framework.
;
; First build downloads the Xtensa toolchain and the precompiled
; micro_ros_platformio library into ~/.platformio (outside the Nix store).

[env:featheresp32-v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit AS5600 Library

board_microros_transport = serial
board_microros_distro = humble

build_flags =
    -D MICRO_ROS_TRANSPORT_ARDUINO_SERIAL
